name: Deploy Application

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment (leave as auto-detect to infer from the branch)
        required: false
        default: auto-detect
        type: choice
        options:
          - auto-detect
          - dev
          - prod

permissions:
  contents: read

# Branch dev uses the dev environment, branch main uses the prod environment.
concurrency:
  group: application-${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev') }}
    outputs:
      environment: ${{ steps.environment.outputs.name }}
      target: ${{ steps.configuration.outputs.target }}
      deploy_api: ${{ steps.configuration.outputs.deploy_api }}
      site-url: ${{ steps.configuration.outputs.site-url }}
      site-base: ${{ steps.configuration.outputs.site-base }}
      ai-api-base: ${{ steps.configuration.outputs.ai-api-base }}
      subscription-id: ${{ steps.deployment_config.outputs.AZURE_SUBSCRIPTION_ID }}
      resource-group: ${{ steps.deployment_config.outputs.AZURE_RESOURCE_GROUP }}
      function-app-name: ${{ steps.deployment_config.outputs.AZURE_FUNCTIONAPP_NAME }}
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_SITE_BASE: ${{ vars.PUBLIC_SITE_BASE }}
      PUBLIC_AI_API_BASE: ${{ vars.PUBLIC_AI_API_BASE }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve environment from branch
        id: environment
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          case "$SOURCE_REF" in
            main) detected=prod ;;
            dev) detected=dev ;;
            *)
              echo "::error title=Unsupported branch::Deploy from 'dev' or 'main', not '$SOURCE_REF'."
              exit 1
              ;;
          esac

          target="${REQUESTED_ENVIRONMENT:-$detected}"
          if [[ "$target" == "auto-detect" ]]; then
            target="$detected"
          fi
          if [[ "$target" != "$detected" ]]; then
            echo "::error title=Branch and environment mismatch::Branch '$SOURCE_REF' maps to $detected, not $target."
            exit 1
          fi

          echo "name=$target" >> "$GITHUB_OUTPUT"
          echo "Deploying '$SOURCE_REF' to the $target environment." >> "$GITHUB_STEP_SUMMARY"

      - name: Load deployment configuration
        id: deployment_config
        env:
          TARGET_ENVIRONMENT: ${{ steps.environment.outputs.name }}
        run: node scripts/deploy-config.mjs --environment "$TARGET_ENVIRONMENT" --github-env --github-output --require-subscription

      - name: Validate selected deployment target
        id: configuration
        run: |
          case "$DEPLOYMENT_TARGET" in
            azure-static-web-app)
              bash infra/azure/validate-environment.sh
              site_url="$AZURE_PUBLIC_SITE_URL"
              site_base="/"
              ai_api_base=""
              if [[ "$AZURE_USE_API" == "true" ]]; then
                ai_api_base="https://$AZURE_FUNCTIONAPP_NAME.azurewebsites.net"
              fi
              ;;
            github-pages)
              : "${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL for the selected deployment Environment}"
              : "${PUBLIC_SITE_BASE:?Set PUBLIC_SITE_BASE for the selected deployment Environment}"
              site_url="$PUBLIC_SITE_URL"
              site_base="$PUBLIC_SITE_BASE"
              ai_api_base="$PUBLIC_AI_API_BASE"
              ;;
            cloudflare-worker-api)
              site_url=""
              site_base=""
              ai_api_base=""
              ;;
            *)
              echo "::error title=Unsupported deployment target::Set DEPLOYMENT_TARGET to azure-static-web-app, github-pages, or cloudflare-worker-api."
              exit 1
              ;;
          esac

          echo "target=$DEPLOYMENT_TARGET" >> "$GITHUB_OUTPUT"
          echo "deploy_api=${AZURE_DEPLOY_API:-false}" >> "$GITHUB_OUTPUT"
          echo "site-url=$site_url" >> "$GITHUB_OUTPUT"
          echo "site-base=$site_base" >> "$GITHUB_OUTPUT"
          echo "ai-api-base=$ai_api_base" >> "$GITHUB_OUTPUT"

      - name: Verify environment secrets
        env:
          TARGET_ENVIRONMENT: ${{ steps.environment.outputs.name }}
          DEPLOY_API: ${{ steps.configuration.outputs.deploy_api }}
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          AZURE_API_CLIENT_ID: ${{ vars.AZURE_API_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=()

          case "$DEPLOYMENT_TARGET" in
            azure-static-web-app)
              [[ -n "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]] || missing+=(AZURE_STATIC_WEB_APPS_API_TOKEN)
              if [[ "$DEPLOY_API" == "true" ]]; then
                [[ -n "$AZURE_API_CLIENT_ID" ]] || missing+=(AZURE_API_CLIENT_ID)
                [[ -n "$AZURE_TENANT_ID" ]] || missing+=(AZURE_TENANT_ID)
                [[ -n "$AZURE_SUBSCRIPTION_ID" ]] || missing+=(AZURE_SUBSCRIPTION_ID)
              fi
              ;;
            cloudflare-worker-api)
              [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
              ;;
          esac

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error title=Missing environment secrets::Add ${missing[*]} to the $TARGET_ENVIRONMENT Environment."
            exit 1
          fi

  build-web:
    if: needs.preflight.outputs.target == 'azure-static-web-app' || needs.preflight.outputs.target == 'github-pages'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load tool versions
        run: jq --raw-output --from-file .devcontainer/export-tool-versions.jq .devcontainer/tool-versions.json >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check web
        working-directory: web
        run: npm run typecheck

      - name: Build web
        working-directory: web
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ needs.preflight.outputs.site-url }}
          PUBLIC_SITE_BASE: ${{ needs.preflight.outputs.site-base }}
          PUBLIC_SITE_NAME: ${{ vars.PUBLIC_SITE_NAME || '' }}
          PUBLIC_SITE_TAGLINE: ${{ vars.PUBLIC_SITE_TAGLINE || '' }}
          PUBLIC_SITE_OWNER: ${{ vars.PUBLIC_SITE_OWNER || '' }}
          PUBLIC_SITE_REPOSITORY: ${{ vars.PUBLIC_SITE_REPOSITORY || '' }}
          PUBLIC_SITE_DESCRIPTION: ${{ vars.PUBLIC_SITE_DESCRIPTION || '' }}
          PUBLIC_AI_API_BASE: ${{ needs.preflight.outputs.ai-api-base }}
          PUBLIC_ENTRA_EXTERNAL_ID_CLIENT_ID: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_CLIENT_ID || '' }}
          PUBLIC_ENTRA_EXTERNAL_ID_AUTHORITY: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_AUTHORITY || '' }}
          PUBLIC_ENTRA_EXTERNAL_ID_API_SCOPE: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_API_SCOPE || '' }}
          PUBLIC_ENTRA_EXTERNAL_ID_ADMIN_ROLE: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_ADMIN_ROLE || '' }}
          PUBLIC_ADMIN_API_BASE: ${{ vars.PUBLIC_ADMIN_API_BASE || '' }}
          PUBLIC_SESSION_API_BASE: ${{ vars.PUBLIC_SESSION_API_BASE || '' }}

      - name: Upload web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-web
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  build-api:
    if: needs.preflight.outputs.target == 'cloudflare-worker-api' || (needs.preflight.outputs.target == 'azure-static-web-app' && needs.preflight.outputs.deploy_api == 'true')
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load tool versions
        working-directory: .
        run: jq --raw-output --from-file .devcontainer/export-tool-versions.jq .devcontainer/tool-versions.json >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Type-check API
        run: npm run typecheck

      - name: Test API
        run: npm test

      - name: Build API
        run: npm run build

      - name: Create Azure Functions package
        if: needs.preflight.outputs.target == 'azure-static-web-app'
        run: |
          npm prune --omit=dev
          npm run smoke:azure
          while IFS= read -r -d '' function_json; do
            package_path="dist/api/$function_json"
            mkdir -p "$(dirname "$package_path")"
            cp "$function_json" "$package_path"
          done < <(find src/adapters/azure/functions -name function.json -print0)
          zip -r "$RUNNER_TEMP/function-app.zip" dist host.json node_modules package.json package-lock.json

      - name: Upload API artifact
        if: needs.preflight.outputs.target == 'azure-static-web-app'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-api
          path: ${{ runner.temp }}/function-app.zip
          if-no-files-found: error
          retention-days: 1

  deploy-azure-site:
    if: needs.preflight.outputs.target == 'azure-static-web-app'
    needs: [preflight, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-web
          path: site-package

      - name: Verify Static Web Apps deployment token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: ': "${AZURE_STATIC_WEB_APPS_API_TOKEN:?Set AZURE_STATIC_WEB_APPS_API_TOKEN in the selected Environment}"'

      - name: Deploy Azure Static Web Apps site
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site-package
          api_location: ""
          output_location: ""
          skip_app_build: true

  deploy-azure-api:
    if: needs.preflight.outputs.target == 'azure-static-web-app' && needs.preflight.outputs.deploy_api == 'true'
    needs: [preflight, build-api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.preflight.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-api
          path: function-package

      - name: Verify Azure deployment configuration
        env:
          AZURE_FUNCTIONAPP_NAME: ${{ needs.preflight.outputs.function-app-name }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_API_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ needs.preflight.outputs.subscription-id }}
        run: |
          : "${AZURE_FUNCTIONAPP_NAME:?Set AZURE_FUNCTIONAPP_NAME in the selected deployment Environment}"
          : "${AZURE_CLIENT_ID:?Set AZURE_API_CLIENT_ID in the selected deployment Environment}"
          : "${AZURE_TENANT_ID:?Set AZURE_TENANT_ID in the selected deployment Environment}"
          : "${AZURE_SUBSCRIPTION_ID:?Set AZURE_SUBSCRIPTION_ID in the selected deployment Environment}"

      - name: Sign in to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_API_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ needs.preflight.outputs.subscription-id }}

      - name: Verify Function App infrastructure
        env:
          FUNCTION_APP_NAME: ${{ needs.preflight.outputs.function-app-name }}
          RESOURCE_GROUP: ${{ needs.preflight.outputs.resource-group }}
        run: |
          az functionapp show --resource-group "$RESOURCE_GROUP" --name "$FUNCTION_APP_NAME" --output none

      - name: Deploy Azure Functions API
        uses: Azure/functions-action@c27ade7ab0db7a7005f1ee0c6aed9fae27ca4249 # v1
        with:
          app-name: ${{ needs.preflight.outputs.function-app-name }}
          package: function-package/function-app.zip

  deploy-github-pages:
    if: needs.preflight.outputs.target == 'github-pages'
    needs: [preflight, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.preflight.outputs.environment }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-web
          path: site-package

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-package

      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  deploy-cloudflare-api:
    if: needs.preflight.outputs.target == 'cloudflare-worker-api'
    needs: [preflight, build-api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.preflight.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load tool versions
        run: jq --raw-output --from-file .devcontainer/export-tool-versions.jq .devcontainer/tool-versions.json >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Verify Cloudflare deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in the selected deployment Environment}"
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in the selected deployment Environment}"

      - name: Deploy Cloudflare Worker API
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy
