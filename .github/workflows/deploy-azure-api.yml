name: Deploy Azure API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Azure naming scope
        required: true
        default: development
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

concurrency:
  group: azure-api-${{ inputs.environment || 'manual' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    environment: azure-${{ inputs.environment }}
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      AZURE_PUBLIC_SITE_URL: ${{ vars.AZURE_PUBLIC_SITE_URL }}
      AZURE_DEPLOY_API: ${{ vars.AZURE_DEPLOY_API }}
      AZURE_USE_API: ${{ vars.AZURE_USE_API }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load tool versions
        working-directory: .
        run: jq --raw-output --from-file .devcontainer/export-tool-versions.jq .devcontainer/tool-versions.json >> "$GITHUB_ENV"

      - name: Validate GitHub Environment configuration
        working-directory: .
        run: |
          bash infra/azure/validate-environment.sh
          if [[ "${AZURE_DEPLOY_API:-false}" != true ]]; then
            echo "::error title=API deployment disabled::Set AZURE_DEPLOY_API=true in the selected GitHub Environment."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Type-check Functions
        run: npm run typecheck

      - name: Test API
        run: npm test

      - name: Build Functions
        run: npm run build

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Smoke-test Azure Functions entries
        run: npm run smoke:azure

      - name: Create deployment package
        run: zip -r "$RUNNER_TEMP/function-app.zip" dist host.json node_modules package.json package-lock.json

      - name: Upload deployment package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-function-app
          path: ${{ runner.temp }}/function-app.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: azure-${{ inputs.environment }}
      url: https://${{ vars.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      AZURE_PUBLIC_SITE_URL: ${{ vars.AZURE_PUBLIC_SITE_URL }}
      AZURE_DEPLOY_API: ${{ vars.AZURE_DEPLOY_API }}
      AZURE_USE_API: ${{ vars.AZURE_USE_API }}
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: azure-function-app
          path: function-package

      - name: Verify OIDC bootstrap configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_API_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${AZURE_CLIENT_ID:?Run infra/azure/bootstrap.sh to configure AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?Run infra/azure/bootstrap.sh to configure AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?Run infra/azure/bootstrap.sh to configure AZURE_SUBSCRIPTION_ID}"

      - name: Sign in to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_API_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Function App infrastructure
        env:
          FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          if ! az functionapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --output none 2>/dev/null; then
            echo "::error title=Missing Function App::Deploy infrastructure component 'api' before publishing API code."
            exit 1
          fi

      - name: Deploy Azure Functions API
        uses: Azure/functions-action@c27ade7ab0db7a7005f1ee0c6aed9fae27ca4249 # v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: function-package/function-app.zip
