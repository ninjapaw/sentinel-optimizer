name: Validate and Deploy Azure Infrastructure

on:
  push:
    branches:
      - main
      - dev
    paths:
      - .github/workflows/deploy-azure-infrastructure.yml
      - config/deploy.config.json
      - scripts/deploy-config.mjs
      - infra/azure/**
  pull_request:
    branches:
      - main
      - dev
    paths:
      - .github/workflows/deploy-azure-infrastructure.yml
      - config/deploy.config.json
      - scripts/deploy-config.mjs
      - infra/azure/**
  workflow_dispatch:
    inputs:
      component:
        description: Azure stack to evaluate or deploy
        required: true
        type: choice
        options:
          - all
          - site
          - api
          - keyvault
          - ai
      environment:
        description: GitHub Environment and Azure naming scope (leave as auto-detect to infer from the branch)
        required: false
        default: auto-detect
        type: choice
        options:
          - auto-detect
          - dev
          - prod
      operation:
        description: Run a safe preview or apply the selected stack
        required: true
        default: what-if
        type: choice
        options:
          - what-if
          - deploy

permissions:
  contents: read

# Branch dev uses the dev environment, branch main uses the prod environment.
concurrency:
  group: azure-infrastructure-${{ github.event_name == 'workflow_dispatch' && ((inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev')) || 'validation' }}-${{ inputs.component || 'all' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load tool versions
        run: jq --raw-output --from-file .devcontainer/export-tool-versions.jq .devcontainer/tool-versions.json >> "$GITHUB_ENV"

      - name: Install Bicep
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/bicep" \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          chmod +x "$RUNNER_TEMP/bicep"

      - name: Validate Bicep and generated templates
        run: |
          "$RUNNER_TEMP/bicep" build infra/azure/bootstrap/main.bicep \
            --outfile "$RUNNER_TEMP/bootstrap.azuredeploy.json"
          cmp "$RUNNER_TEMP/bootstrap.azuredeploy.json" \
            infra/azure/bootstrap/azuredeploy.json
          "$RUNNER_TEMP/bicep" build-params \
            infra/azure/bootstrap/main.bicepparam \
            --outfile "$RUNNER_TEMP/bootstrap.parameters.json"
          "$RUNNER_TEMP/bicep" build infra/azure/main.bicep \
            --outfile "$RUNNER_TEMP/all.azuredeploy.json"
          for environment in dev prod; do
            "$RUNNER_TEMP/bicep" build-params \
              "infra/azure/main.${environment}.bicepparam" \
              --outfile "$RUNNER_TEMP/all.${environment}.parameters.json"
          done

          for component in site api keyvault ai; do
            "$RUNNER_TEMP/bicep" build "infra/azure/$component/main.bicep" \
              --outfile "$RUNNER_TEMP/$component.azuredeploy.json"
            cmp "$RUNNER_TEMP/$component.azuredeploy.json" \
              "infra/azure/$component/azuredeploy.json"
            "$RUNNER_TEMP/bicep" build-params \
              "infra/azure/$component/main.bicepparam" \
              --outfile "$RUNNER_TEMP/$component.parameters.json"
          done

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev') }}
    permissions:
      contents: read
      id-token: write
    env:
      ENTRA_EXTERNAL_ID_ISSUER: ${{ vars.ENTRA_EXTERNAL_ID_ISSUER }}
      ENTRA_EXTERNAL_ID_JWKS_URI: ${{ vars.ENTRA_EXTERNAL_ID_JWKS_URI }}
      ENTRA_EXTERNAL_ID_AUDIENCE: ${{ vars.ENTRA_EXTERNAL_ID_AUDIENCE }}
      ENTRA_EXTERNAL_ID_ADMIN_ROLE: ${{ vars.ENTRA_EXTERNAL_ID_ADMIN_ROLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load deployment configuration
        id: deployment_config
        env:
          TARGET_ENVIRONMENT: ${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev') }}
        run: node scripts/deploy-config.mjs --environment "$TARGET_ENVIRONMENT" --github-env --github-output --require-subscription

      - name: Verify branch matches environment
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          case "$SOURCE_REF" in
            main) detected=production ;;
            dev) detected=development ;;
            *)
              echo "::error title=Unsupported branch::Deploy from 'dev' (development) or 'main' (production), not '$SOURCE_REF'."
              exit 1
              ;;
          esac

          if [[ "$AZURE_ENVIRONMENT" != "$detected" ]]; then
            echo "::error title=Branch and environment mismatch::Branch '$SOURCE_REF' maps to $detected, not $AZURE_ENVIRONMENT."
            exit 1
          fi

          echo "Targeting the $AZURE_ENVIRONMENT environment from '$SOURCE_REF'." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate GitHub Environment configuration
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          bash infra/azure/validate-environment.sh
          case "$COMPONENT" in
            all|site|api) ;;
            keyvault)
              : "${AZURE_KEY_VAULT_NAME:?Set AZURE_KEY_VAULT_NAME as an Environment variable}"
              ;;
            ai)
              : "${AZURE_OPENAI_ACCOUNT_NAME:?Set AZURE_OPENAI_ACCOUNT_NAME as an Environment variable}"
              : "${AZURE_OPENAI_MODEL_NAME:?Set AZURE_OPENAI_MODEL_NAME as an Environment variable}"
              : "${AZURE_OPENAI_MODEL_DEPLOYMENT:?Set AZURE_OPENAI_MODEL_DEPLOYMENT as an Environment variable}"
              ;;
          esac

      - name: Verify OIDC bootstrap configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_API_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_API_PRINCIPAL_OBJECT_ID }}
          COMPONENT: ${{ inputs.component }}
        run: |
          : "${AZURE_CLIENT_ID:?Run infra/azure/bootstrap.sh to configure AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?Run infra/azure/bootstrap.sh to configure AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?Run infra/azure/bootstrap.sh to configure AZURE_SUBSCRIPTION_ID}"
          if [[ "$COMPONENT" == api ]]; then
            : "${AZURE_API_PRINCIPAL_OBJECT_ID:?Run infra/azure/bootstrap.sh to configure API deployment identity}"
          fi
      - name: Sign in to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.deployment_config.outputs.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure resource prerequisites
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          : "${AZURE_LOCATION:?Set the organization or environment variable AZURE_LOCATION}"

          if [[ "$(az group exists --name "$AZURE_RESOURCE_GROUP")" != true ]]; then
            echo "::error title=Missing Azure resource group::Run infra/azure/bootstrap.sh to create '$AZURE_RESOURCE_GROUP' and configure OIDC."
            exit 1
          fi

          case "$COMPONENT" in
            api)
              if ! az staticwebapp show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_STATIC_WEB_APP_NAME" \
                --output none 2>/dev/null; then
                echo "::error title=Missing Static Web App::Deploy infrastructure component 'site' before component 'api'."
                exit 1
              fi
              ;;
            ai)
              if ! az functionapp show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_FUNCTIONAPP_NAME" \
                --output none 2>/dev/null; then
                echo "::error title=Missing Function App::Deploy infrastructure component 'api' before component 'ai'."
                exit 1
              fi
              ;;
          esac

      - name: Evaluate or deploy selected stack
        env:
          AZURE_API_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_API_PRINCIPAL_OBJECT_ID }}
          AZURE_INFRA_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_INFRA_PRINCIPAL_OBJECT_ID }}
          COMPONENT: ${{ inputs.component }}
          OPERATION: ${{ inputs.operation }}
        run: |
          : "${AZURE_LOCATION:?Set AZURE_LOCATION in the selected GitHub Environment}"
          : "${AZURE_RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP in the selected GitHub Environment}"

          command_name="$OPERATION"
          if [[ "$OPERATION" == "deploy" ]]; then
            command_name="create"
          fi

          parameters=(location="$AZURE_LOCATION")
          case "$COMPONENT" in
            all)
              environment_file="infra/azure/main.${DEPLOY_ENVIRONMENT}.bicepparam"
              [[ -f "$environment_file" ]] || {
                echo "::error title=Missing environment parameters::Cannot find $environment_file."
                exit 1
              }
              az deployment group "$command_name" \
                --name "sentinel-optimizer-all-${GITHUB_RUN_NUMBER}" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --template-file infra/azure/main.bicep \
                --parameters \
                  "$environment_file" \
                  deployOpenAi="$AZURE_DEPLOY_OPENAI" \
                  keyVaultName="$AZURE_KEY_VAULT_NAME" \
                  aiApiKeySecretName="${AZURE_AI_API_KEY_SECRET_NAME:-ai-api-key}" \
                  apiDeploymentPrincipalId="$AZURE_API_PRINCIPAL_OBJECT_ID" \
                  infrastructurePrincipalId="$AZURE_INFRA_PRINCIPAL_OBJECT_ID" \
                  enableAnonymousAiRoutes="$AZURE_ENABLE_ANONYMOUS_AI_ROUTES" \
                  entraExternalIdIssuer="$ENTRA_EXTERNAL_ID_ISSUER" \
                  entraExternalIdJwksUri="$ENTRA_EXTERNAL_ID_JWKS_URI" \
                  entraExternalIdAudience="$ENTRA_EXTERNAL_ID_AUDIENCE" \
                  entraExternalIdAdminRole="${ENTRA_EXTERNAL_ID_ADMIN_ROLE:-SentinelOptimizer.Admin}"
              ;;
            site)
              : "${AZURE_STATIC_WEB_APP_NAME:?Set AZURE_STATIC_WEB_APP_NAME as an Environment variable}"
              parameters+=(
                siteName="$AZURE_STATIC_WEB_APP_NAME"
                siteSkuName="$AZURE_SITE_SKU"
                environmentName="$AZURE_ENVIRONMENT"
              )
              ;;
            api)
              : "${AZURE_FUNCTIONAPP_NAME:?Set AZURE_FUNCTIONAPP_NAME as an Environment variable}"
              static_web_app_hostname="$(az staticwebapp show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_STATIC_WEB_APP_NAME" \
                --query defaultHostname \
                --output tsv)"
              : "${static_web_app_hostname:?Deploy the configured Static Web App before the API}"
              parameters+=(
                functionAppName="$AZURE_FUNCTIONAPP_NAME"
                instanceMemoryMB="$AZURE_FUNCTION_INSTANCE_MEMORY_MB"
                maximumInstanceCount="$AZURE_FUNCTION_MAXIMUM_INSTANCE_COUNT"
                alwaysReadyInstanceCount="$AZURE_FUNCTION_ALWAYS_READY_INSTANCES"
                storageSkuName="$AZURE_FUNCTION_STORAGE_SKU"
                apiDeploymentPrincipalId="$AZURE_API_PRINCIPAL_OBJECT_ID"
                allowedOrigins="[\"https://$static_web_app_hostname\"]"
                enableAnonymousAiRoutes="$AZURE_ENABLE_ANONYMOUS_AI_ROUTES"
                entraExternalIdIssuer="$ENTRA_EXTERNAL_ID_ISSUER"
                entraExternalIdJwksUri="$ENTRA_EXTERNAL_ID_JWKS_URI"
                entraExternalIdAudience="$ENTRA_EXTERNAL_ID_AUDIENCE"
                entraExternalIdAdminRole="${ENTRA_EXTERNAL_ID_ADMIN_ROLE:-SentinelOptimizer.Admin}"
                environmentName="$AZURE_ENVIRONMENT"
              )
              ;;
            keyvault)
              : "${AZURE_KEY_VAULT_NAME:?Set AZURE_KEY_VAULT_NAME as an Environment variable}"
              key_vault_function_app=""
              if [[ -n "${AZURE_FUNCTIONAPP_NAME:-}" ]] && az functionapp show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_FUNCTIONAPP_NAME" \
                --output none 2>/dev/null; then
                key_vault_function_app="$AZURE_FUNCTIONAPP_NAME"
              fi
              parameters+=(
                keyVaultName="$AZURE_KEY_VAULT_NAME"
                functionAppName="$key_vault_function_app"
                deploymentPrincipalId="${AZURE_INFRA_PRINCIPAL_OBJECT_ID:-}"
                environmentName="$AZURE_ENVIRONMENT"
              )
              ;;
            ai)
              : "${AZURE_FUNCTIONAPP_NAME:?Set AZURE_FUNCTIONAPP_NAME as an Environment variable}"
              : "${AZURE_OPENAI_ACCOUNT_NAME:?Set AZURE_OPENAI_ACCOUNT_NAME as an Environment variable}"
              parameters+=(
                functionAppName="$AZURE_FUNCTIONAPP_NAME"
                openAiAccountName="$AZURE_OPENAI_ACCOUNT_NAME"
                modelName="$AZURE_OPENAI_MODEL_NAME"
                modelDeploymentName="$AZURE_OPENAI_MODEL_DEPLOYMENT"
                modelDeploymentSkuName="$AZURE_OPENAI_DEPLOYMENT_SKU"
                modelCapacity="$AZURE_OPENAI_MODEL_CAPACITY"
                environmentName="$AZURE_ENVIRONMENT"
              )
              ;;
          esac

          if [[ "$COMPONENT" != all ]]; then
            az deployment group "$command_name" \
              --name "sentinel-optimizer-$COMPONENT-${GITHUB_RUN_NUMBER}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file "infra/azure/$COMPONENT/azuredeploy.json" \
              --parameters "${parameters[@]}"
          fi
