name: Deploy Azure Site

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Azure naming scope
        required: true
        default: development
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

concurrency:
  group: azure-site-${{ inputs.environment || 'manual' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-${{ inputs.environment }}
    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME }}
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
      AZURE_PUBLIC_SITE_URL: ${{ vars.AZURE_PUBLIC_SITE_URL }}
      AZURE_DEPLOY_API: ${{ vars.AZURE_DEPLOY_API }}
      AZURE_USE_API: ${{ vars.AZURE_USE_API }}
      PUBLIC_ENTRA_EXTERNAL_ID_CLIENT_ID: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_CLIENT_ID }}
      PUBLIC_ENTRA_EXTERNAL_ID_AUTHORITY: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_AUTHORITY }}
      PUBLIC_ENTRA_EXTERNAL_ID_API_SCOPE: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_API_SCOPE }}
      PUBLIC_ENTRA_EXTERNAL_ID_ADMIN_ROLE: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_ADMIN_ROLE }}
      PUBLIC_ADMIN_API_BASE: ${{ vars.PUBLIC_ADMIN_API_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load tool versions
        run: jq --raw-output --from-file .devcontainer/export-tool-versions.jq .devcontainer/tool-versions.json >> "$GITHUB_ENV"

      - name: Load GitHub Environment configuration
        id: infrastructure-config
        run: |
          bash infra/azure/validate-environment.sh

          api_base=""
          if [[ "$AZURE_USE_API" == "true" ]]; then
            api_base="https://$AZURE_FUNCTIONAPP_NAME.azurewebsites.net"
          fi

          echo "public-site-url=$AZURE_PUBLIC_SITE_URL" >> "$GITHUB_OUTPUT"
          echo "api-base=$api_base" >> "$GITHUB_OUTPUT"

      - name: Verify enabled API is available
        if: steps.infrastructure-config.outputs.api-base != ''
        env:
          API_BASE: ${{ steps.infrastructure-config.outputs.api-base }}
        run: |
          if ! curl --fail --silent --show-error \
            --max-time 20 \
            "$API_BASE/api/health" > /dev/null; then
            echo "::error title=Azure API unavailable::Deploy the API infrastructure and code, or set AZURE_USE_API=false in the selected GitHub Environment."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check web
        working-directory: web
        run: npm run typecheck

      - name: Build web
        working-directory: web
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ steps.infrastructure-config.outputs.public-site-url }}
          PUBLIC_SITE_BASE: /
          PUBLIC_AI_API_BASE: ${{ steps.infrastructure-config.outputs.api-base }}
          PUBLIC_ENTRA_EXTERNAL_ID_CLIENT_ID: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_CLIENT_ID }}
          PUBLIC_ENTRA_EXTERNAL_ID_AUTHORITY: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_AUTHORITY }}
          PUBLIC_ENTRA_EXTERNAL_ID_API_SCOPE: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_API_SCOPE }}
          PUBLIC_ENTRA_EXTERNAL_ID_ADMIN_ROLE: ${{ vars.PUBLIC_ENTRA_EXTERNAL_ID_ADMIN_ROLE }}
          PUBLIC_ADMIN_API_BASE: ${{ vars.PUBLIC_ADMIN_API_BASE }}

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-static-site
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  deploy-site:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: azure-${{ inputs.environment }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: azure-static-site
          path: site-package

      - name: Verify Static Web Apps deployment token
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          : "${AZURE_STATIC_WEB_APPS_API_TOKEN:?Add AZURE_STATIC_WEB_APPS_API_TOKEN after deploying the site infrastructure}"

      - name: Deploy Azure Static Web Apps site
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site-package
          api_location: ""
          output_location: ""
          skip_app_build: true
