name: Deploy Azure Site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-azure-site.yml
      - estimators/**
      - parsers/**
      - pricing/**
      - schema/**
      - shared/**
      - web/**
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main
    paths:
      - .github/workflows/deploy-azure-site.yml
      - estimators/**
      - parsers/**
      - pricing/**
      - schema/**
      - shared/**
      - web/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check web
        working-directory: web
        run: npm run typecheck

      - name: Build web
        working-directory: web
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.AZURE_STATIC_WEB_APP_URL || 'https://sentineloptimizer.com' }}
          PUBLIC_SITE_BASE: /
          PUBLIC_AI_API_BASE: ${{ vars.PUBLIC_AI_API_BASE || '' }}

      - name: Upload site artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: azure-static-site
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  deploy-site:
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'closed') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: azure-static-site
          path: site-package

      - name: Deploy Azure Static Web Apps site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site-package
          api_location: ""
          output_location: ""
          skip_app_build: true

  close-pull-request:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Close Azure preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
