name: Deploy Cloudflare API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-api.yml
      - api/**
      - shared/**
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-api.yml
      - api/**
      - shared/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load tool versions
        working-directory: .
        run: jq --raw-output --from-file .devcontainer/export-tool-versions.jq .devcontainer/tool-versions.json >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Type-check API
        run: npm run typecheck

      - name: Test API
        run: npm test

      - name: Build API
        run: npm run build

  deploy:
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_API_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-api
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load tool versions
        run: jq --raw-output --from-file .devcontainer/export-tool-versions.jq .devcontainer/tool-versions.json >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Verify Cloudflare deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID for the cloudflare-api environment}"
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN for the cloudflare-api environment}"

      - name: Deploy Cloudflare Worker API
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy
