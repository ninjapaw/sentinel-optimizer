name: Deploy GitHub Pages Site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-github-pages-site.yml
      - estimators/**
      - parsers/**
      - pricing/**
      - schema/**
      - shared/**
      - web/**
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .github/workflows/deploy-github-pages-site.yml
      - estimators/**
      - parsers/**
      - pricing/**
      - schema/**
      - shared/**
      - web/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load tool versions
        run: jq --raw-output --from-file .devcontainer/export-tool-versions.jq .devcontainer/tool-versions.json >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check web
        working-directory: web
        run: npm run typecheck

      - name: Build web
        working-directory: web
        # GitHub Pages serves this repo at the apex custom domain
        # (sentineloptimizer.com), not at https://<owner>.github.io/<repo>/, so
        # assets must be built with base "/". Forks without a custom domain
        # configured should set the PUBLIC_SITE_URL / PUBLIC_SITE_BASE
        # repository variables to their own https://<owner>.github.io/<repo>/
        # values.
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://sentineloptimizer.com' }}
          PUBLIC_SITE_BASE: ${{ vars.PUBLIC_SITE_BASE || '/' }}
          PUBLIC_AI_API_BASE: ${{ vars.PUBLIC_AI_API_BASE || '' }}

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && vars.PAGES_DEPLOY_ENABLED == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.PAGES_DEPLOY_ENABLED == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request' && vars.PAGES_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
