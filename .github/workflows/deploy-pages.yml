name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL || 'https://ninjapaw.github.io/sentinel-optimizer' }}
          PUBLIC_SITE_BASE: ${{ secrets.PUBLIC_SITE_BASE || '/sentinel-optimizer/' }}
          # Optional: set PUBLIC_AI_API_BASE to a custom Azure Function or Cloudflare Worker URL
          # to use server-side AI. Leave unset to rely on the user-configured Azure OpenAI
          # credentials stored in their browser (localStorage).
          PUBLIC_AI_API_BASE: ${{ secrets.PUBLIC_AI_API_BASE || '' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
