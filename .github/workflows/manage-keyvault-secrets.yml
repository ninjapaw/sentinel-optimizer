name: Manage Key Vault Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment (leave as auto-detect to infer from the branch)
        required: false
        default: auto-detect
        type: choice
        options:
          - auto-detect
          - dev
          - prod
      operation:
        description: Synchronize secret values or audit expiration only
        required: true
        default: audit
        type: choice
        options:
          - audit
          - sync
      dry_run:
        description: Report planned secret writes without applying them
        required: true
        default: true
        type: boolean
  schedule:
    # Weekly expiration audit. Environment approvals, when configured, also gate this run.
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Branch dev uses the dev environment, branch main uses the prod environment.
concurrency:
  group: keyvault-${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev') }}
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_COSMOS_ACCOUNT_NAME: ${{ vars.AZURE_COSMOS_ACCOUNT_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load deployment configuration
        id: deployment_config
        env:
          TARGET_ENVIRONMENT: ${{ (inputs.environment != '' && inputs.environment != 'auto-detect' && inputs.environment) || (github.ref_name == 'main' && 'prod' || 'dev') }}
        run: node scripts/deploy-config.mjs --environment "$TARGET_ENVIRONMENT" --github-env --github-output --require-subscription

      - name: Verify Key Vault configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          : "${AZURE_KEY_VAULT_NAME:?Set AZURE_KEY_VAULT_NAME in the selected deployment Environment}"
          : "${AZURE_CLIENT_ID:?Run infra/azure/bootstrap.sh to configure AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?Run infra/azure/bootstrap.sh to configure AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?Run infra/azure/bootstrap.sh to configure AZURE_SUBSCRIPTION_ID}"

      - name: Sign in to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ steps.deployment_config.outputs.AZURE_SUBSCRIPTION_ID }}

      - name: Synchronize secrets
        if: inputs.operation == 'sync'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          arguments=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            arguments+=(--dry-run)
          fi
          if [[ -n "${AZURE_COSMOS_ACCOUNT_NAME:-}" ]]; then
            arguments+=(--cosmos-account "$AZURE_COSMOS_ACCOUNT_NAME")
          fi
          bash infra/azure/keyvault/sync-secrets.sh "${arguments[@]}"

      - name: Audit secret expiration
        run: bash infra/azure/keyvault/audit-secrets.sh
