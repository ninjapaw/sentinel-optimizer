name: Promote Dev to Main

on:
  workflow_dispatch:
    inputs:
      title:
        description: Pull request title
        required: true
        default: Promote dev to main
      require-ci:
        description: Require a successful Continuous Integration run on the dev head commit
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  open-promotion-pr:
    uses: ninjapaw/pawprint/.github/workflows/kit-promote.yml@de65a5017f51b2ca9213ec07b5fbfc889262fee2
    with:
      source-branch: dev
      target-branch: main
      require-ci: ${{ inputs.require-ci == 'true' }}
      ci-workflow: ci.yml
      pr-title: ${{ inputs.title }}
